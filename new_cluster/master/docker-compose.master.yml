

services:

  master:    
    build:
      context: ..
      dockerfile: master/Dockerfile.master
    container_name: &NAMENODE_NAME master
    hostname: *NAMENODE_NAME
    network_mode: "host"
    env_file: ../../.env
    volumes: 
      - namenode_data:/home/hadoop/hadoop/hdfs/namenode
      - namenode_data_datanode:/home/hadoop/hadoop/hdfs/datanode

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    network_mode: "host"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/files:/var/lib/grafana/files
      - ../grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    network_mode: "host"

  node-exporter-master:
    image: prom/node-exporter
    container_name: exporter-master
    network_mode: service:master


volumes:
  grafana:
  namenode_data:
  namenode_data_datanode:

networks:
  hadoop-net:
    driver: bridge