<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Fluxo do comando start</title><desc id="desc">Da leitura do YAML à inicialização do Hadoop.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18203b"/></linearGradient><linearGradient id="c" x2="1" y2="1"><stop stop-color="#4438b8"/><stop offset="1" stop-color="#24205d"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#75e6da"/></marker><style>.T{font:700 28px system-ui;fill:#fff}.s{font:400 14px system-ui;fill:#b9c4e2}.n{font:800 20px system-ui;fill:#75e6da}.h{font:700 16px system-ui;fill:#fff}.t{font:400 13px system-ui;fill:#dce4ff}.l{stroke:#75e6da;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1200" height="430" rx="24" fill="url(#b)"/><text x="52" y="56" class="T">Fluxo de inicialização</text><text x="52" y="82" class="s">sudo ./shanks start --config ./config.local.yml</text>
<g transform="translate(45 120)"><rect width="185" height="200" rx="18" fill="url(#c)"/><text x="20" y="38" class="n">01</text><text x="20" y="76" class="h">Ler inventário</text><text x="20" y="105" class="t">Master e workers</text><text x="20" y="128" class="t">a partir do YAML</text></g><line x1="230" y1="220" x2="268" y2="220" class="l"/>
<g transform="translate(275 120)"><rect width="185" height="200" rx="18" fill="url(#c)"/><text x="20" y="38" class="n">02</text><text x="20" y="76" class="h">Configurar hosts</text><text x="20" y="105" class="t">Atualizar /etc/hosts</text><text x="20" y="128" class="t">local e remotamente</text></g><line x1="460" y1="220" x2="498" y2="220" class="l"/>
<g transform="translate(505 120)"><rect width="185" height="200" rx="18" fill="url(#c)"/><text x="20" y="38" class="n">03</text><text x="20" y="76" class="h">Dimensionar YARN</text><text x="20" y="105" class="t">Validar RAM, gerar</text><text x="20" y="128" class="t">e distribuir .env</text></g><line x1="690" y1="220" x2="728" y2="220" class="l"/>
<g transform="translate(735 120)"><rect width="185" height="200" rx="18" fill="url(#c)"/><text x="20" y="38" class="n">04</text><text x="20" y="76" class="h">Construir imagens</text><text x="20" y="105" class="t">hadoop-base em</text><text x="20" y="128" class="t">todos os nós</text></g><line x1="920" y1="220" x2="958" y2="220" class="l"/>
<g transform="translate(965 120)"><rect width="190" height="200" rx="18" fill="url(#c)"/><text x="20" y="38" class="n">05</text><text x="20" y="76" class="h">Subir o cluster</text><text x="20" y="105" class="t">Compose inicia HDFS,</text><text x="20" y="128" class="t">YARN e métricas</text></g><text x="52" y="370" class="s">Resultado: serviços distribuídos, volumes persistentes e métricas centralizadas.</text>
</svg>
