<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do S.H.A.N.K.S</title><desc id="desc">A CLI no master controla Hadoop, observabilidade e workers remotos via SSH.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18203b"/></linearGradient><linearGradient id="m" x2="1" y2="1"><stop stop-color="#5b4ce3"/><stop offset="1" stop-color="#302982"/></linearGradient><linearGradient id="w" x2="1" y2="1"><stop stop-color="#087f75"/><stop offset="1" stop-color="#064e49"/></linearGradient><filter id="s"><feDropShadow dy="6" stdDeviation="7" flood-opacity=".28"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#75e6da"/></marker><style>.T{font:700 30px system-ui;fill:#fff}.S{font:400 15px system-ui;fill:#aeb9d6}.H{font:700 20px system-ui;fill:#fff}.L{font:600 15px system-ui;fill:#fff}.x{font:400 13px system-ui;fill:#dce4ff}.b{stroke:#ffffff22;stroke-width:1.5}.f{fill:none;stroke:#75e6da;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/><text x="60" y="62" class="T">Arquitetura do S.H.A.N.K.S</text><text x="60" y="90" class="S">HDFS, YARN e observabilidade distribuídos</text>
<rect x="50" y="128" width="500" height="475" rx="22" fill="url(#m)" filter="url(#s)"/><text x="80" y="170" class="H">MASTER / NAMENODE</text><text x="80" y="195" class="x">Administração e serviços centrais</text>
<rect x="80" y="225" width="205" height="78" rx="13" fill="#151a33" class="b"/><text x="100" y="255" class="L">CLI shanks</text><text x="100" y="279" class="x">Go · Cobra · SSH</text>
<rect x="315" y="225" width="205" height="78" rx="13" fill="#151a33" class="b"/><text x="335" y="255" class="L">Configuração</text><text x="335" y="279" class="x">YAML · hosts · .env</text>
<rect x="80" y="335" width="205" height="100" rx="13" fill="#151a33" class="b"/><text x="100" y="365" class="L">HDFS</text><text x="100" y="390" class="x">NameNode + DataNode</text><text x="100" y="414" class="x">Volumes persistentes</text>
<rect x="315" y="335" width="205" height="100" rx="13" fill="#151a33" class="b"/><text x="335" y="365" class="L">YARN</text><text x="335" y="390" class="x">ResourceManager</text><text x="335" y="414" class="x">NodeManager</text>
<rect x="80" y="467" width="440" height="100" rx="13" fill="#151a33" class="b"/><text x="100" y="497" class="L">Observabilidade</text><text x="100" y="523" class="x">Prometheus · Grafana · JMX · Node Exporter</text><text x="100" y="547" class="x">9870 · 8088 · 9090 · 3000</text>
<rect x="690" y="128" width="460" height="475" rx="22" fill="#10172a" stroke="#169c8f" stroke-width="2" filter="url(#s)"/><text x="720" y="170" class="H">WORKERS / DATANODES</text><text x="720" y="195" class="x">Máquinas acessadas por SSH</text>
<g transform="translate(720 225)"><rect width="400" height="94" rx="13" fill="url(#w)" class="b"/><text x="22" y="30" class="L">Worker 1</text><text x="22" y="56" class="x">DataNode · NodeManager · Node Exporter</text><text x="22" y="78" class="x">Volume HDFS local</text></g>
<g transform="translate(720 342)"><rect width="400" height="94" rx="13" fill="url(#w)" class="b"/><text x="22" y="30" class="L">Worker 2</text><text x="22" y="56" class="x">DataNode · NodeManager · Node Exporter</text><text x="22" y="78" class="x">Volume HDFS local</text></g>
<g transform="translate(720 459)"><rect width="400" height="94" rx="13" fill="url(#w)" class="b"/><text x="22" y="30" class="L">Worker N</text><text x="22" y="56" class="x">Escala pela lista do YAML</text><text x="22" y="78" class="x">Compose + rede do host</text></g>
<path d="M550 270c60 0 80 0 140 0" class="f"/><text x="585" y="253" class="x">SSH :22</text><path d="M690 405c-60 0-80 0-140 0" class="f"/><text x="575" y="390" class="x">HDFS / YARN</text><path d="M690 520c-60 0-80 0-140 0" class="f"/><text x="572" y="505" class="x">Métricas</text><text x="60" y="645" class="S">LAN, VPN ou ZeroTier · serviços na rede do host</text>
